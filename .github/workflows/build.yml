name: Sync and Build Odysseus Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sync and build (dev or main)'
        required: false
        default: 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/odysseus-dev/odysseus.git

      - name: Fetch upstream
        run: git fetch upstream ${{ github.event.inputs.branch }}

      - name: Check for incoming commits
        id: diff
        run: |
          COUNT=$(git log HEAD..upstream/${{ github.event.inputs.branch }} --oneline | wc -l)
          echo "Commits incoming: $COUNT"
          echo "### Commits coming in from upstream" >> $GITHUB_STEP_SUMMARY
          git log HEAD..upstream/${{ github.event.inputs.branch }} --oneline >> $GITHUB_STEP_SUMMARY || true
          echo "changed=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Merge upstream in instead of hard-resetting. -X ours means: if the
          # SAME file is changed on both sides, keep our fork's version. Any
          # fork-only paths (ci/, custom workflow jobs, etc.) are never touched
          # by upstream's changes, so they survive automatically — no backup/
          # restore choreography needed.
          git merge upstream/${{ github.event.inputs.branch }} \
            -X ours \
            -m "chore: sync upstream ${{ github.event.inputs.branch }}" \
            --allow-unrelated-histories

      - name: Push
        run: git push origin ${{ github.event.inputs.branch }}

  build-and-push:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (post-sync)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Read project version from pyproject.toml
        id: version
        run: |
          VERSION=$(python3 -c "
          import re, sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          v = data.get('project', {}).get('version') \
              or data.get('tool', {}).get('poetry', {}).get('version')
          print(v or '')
          " 2>/dev/null || true)

          if [ -z "$VERSION" ]; then
            echo "::warning::Could not read version from pyproject.toml, falling back to 0.0.0"
            VERSION="0.0.0"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag pattern: <version>-<branch>.<short-sha>
      # e.g. 1.0.2-dev.c2f885b when branch=dev, 1.0.2-main.c2f885b when branch=main
      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-${{ github.event.inputs.branch }}.{{sha}}
            type=raw,value=latest-${{ github.event.inputs.branch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-vulkan-layer:
    needs: [sync, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (post-sync)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Vulkan layer
        uses: docker/build-push-action@v6
        with:
          context: ./ci
          file: ./ci/Dockerfile.vulkan
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ github.event.inputs.branch }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ github.event.inputs.branch }}-vulkan
          cache-from: type=gha
          cache-to: type=gha,mode=max
